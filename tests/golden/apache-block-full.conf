    # BEGIN stop-bots (DO NOT EDIT)
    RewriteEngine On
    Alias "/robots.txt" "/etc/stop-bots/apache/robots.txt"
    <Directory "/etc/stop-bots/apache">
        Require all granted
    </Directory>
    RewriteCond %{HTTP_USER_AGENT} "(?:BadBot)" [NC]
    RewriteRule ^ - [E=stop_bots_block:1]
    RewriteCond %{HTTP:Accept} "(?:^$)"
    RewriteRule ^ - [E=stop_bots_block:1]
    RewriteCond %{HTTP_HOST} "(?:^(\d+\.\d+\.\d+\.\d+|\[))"
    RewriteRule ^ - [E=stop_bots_block:1]
    RewriteCond %{REQUEST_URI} "(?:^(/\.well-known/|/robots\.txt$))" [NC]
    RewriteRule ^ - [E=stop_bots_block:0]
    RewriteCond %{HTTP_USER_AGENT} "(?:okhttp)" [NC]
    RewriteCond %{REQUEST_URI} "(?:^(/remote\.php/dav/))" [NC]
    RewriteRule ^ - [E=stop_bots_block:0]
    RewriteCond %{ENV:stop_bots_trusted} =1
    RewriteRule ^ - [E=stop_bots_block:0]
    RewriteCond %{ENV:stop_bots_block} =1
    RewriteRule ^ - [R=410,L]
    # END stop-bots
