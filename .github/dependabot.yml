# Kept deliberately quiet: this is a one-maintainer project, and a PR per patch
# release of a transitive crate is how a security tool ends up with a stale
# dependency tree that nobody reads any more.
#
# Weekly, grouped, and only the two ecosystems that actually ship here.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for everything routine. A major bump still comes on its own,
      # because that is the one that needs reading.
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  # The workflows pin each action to a commit, with its release in a trailing
  # comment (`@<sha> # v2.9.2`); this is what moves both. A tag can be moved
  # by whoever controls the action's repository, and the release workflow
  # builds the binaries the APT key signs, so a tag is not enough.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # It has no releases: its refs name a toolchain. Pinned to a commit of its
    # `stable` branch, with the MSRV job's toolchain given as an input. Its
    # `@1.88.0` tag was once "bumped" here to the newest Rust (#8), which
    # would have turned the MSRV check into a second stable build that can
    # never fail for the reason it exists. Moved by hand.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
