<VirtualHost *:8080>
    ServerName test.example
    DocumentRoot /var/www/test
    # `combined`, with the client mod_remoteip found (%a), to the log path
    # RHEL's own httpd.conf uses: relative to ServerRoot, through `logs`.
    CustomLog logs/access_log "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\""
    ErrorLog logs/error_log
</VirtualHost>
