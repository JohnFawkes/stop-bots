# Generated by stop-bots (`Web Access` panel). Safe to edit or delete.
#
# Plain HTTP: the console's password and session cookie are in the clear
# until this host has a certificate for console.example.com. Get one with:
#
#     certbot --apache -d console.example.com
#
# then run `stop-bots set-web --secure-cookie true` so the cookie is
# HTTPS-only.
<VirtualHost *:80>
    ServerName console.example.com
    # The console shows what attackers sent, and its requests carry it:
    # logged where the detectors read, they would block its operator.
    CustomLog /dev/null common

    # BEGIN stop-bots console (DO NOT EDIT)
    <Location "/">
        ProxyPass "http://127.0.0.1:8787/"
        ProxyPreserveHost On
    </Location>
    # END stop-bots console
</VirtualHost>
