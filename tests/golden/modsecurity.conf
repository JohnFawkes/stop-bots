# Generated by stop-bots {VERSION}. Edits will be overwritten.
# ModSecurity for the sites stop-bots manages: the engine, each site's
# rules, then the OWASP Core Rule Set. See `stop-bots set-modsecurity`.

SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000
SecTmpDir /tmp/
SecDataDir /tmp/
SecArgumentSeparator &
SecCookieFormat 0
SecStatusEngine Off
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/nginx/stop-bots-modsecurity.log

# site 3: ModSecurity: block, paranoia 2, CRS exclusions for wordpress, 1 exclusion(s) of its own
SecRule UNIQUE_ID "@beginsWith sb3-" "id:10001,phase:1,pass,nolog,t:none,setvar:tx.paranoia_level=2,ctl:ruleEngine=On,setvar:tx.crs_exclusions_wordpress=1"
SecRule UNIQUE_ID "@beginsWith sb3-" "id:10002,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@beginsWith /wp-admin/admin-ajax.php" "t:none,ctl:ruleRemoveById=942100"

# site 7: ModSecurity: detect, paranoia 1, 1 exclusion(s) of its own
SecRule UNIQUE_ID "@beginsWith sb7-" "id:10003,phase:1,pass,nolog,t:none,setvar:tx.paranoia_level=1"
SecRule UNIQUE_ID "@beginsWith sb7-" "id:10004,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@beginsWith /api/assets" "t:none,ctl:requestBodyAccess=Off"

Include /etc/modsecurity/crs/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/*.conf
